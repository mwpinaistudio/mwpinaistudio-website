<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>PaiPinTong - AI Listing Assistant Demo</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02050c;color:#eef5ff;font-family:'Inter','Segoe UI',system-ui,-apple-system,'Noto Sans SC',sans-serif;-webkit-font-smoothing:antialiased}
.demo{position:relative;width:100%;height:100%;min-height:300px;overflow:hidden;background:radial-gradient(900px 520px at 16% -10%,rgba(255,111,60,.13),transparent 60%),radial-gradient(1000px 560px at 88% 4%,rgba(48,120,255,.22),transparent 62%),radial-gradient(700px 700px at 50% 120%,rgba(93,242,214,.08),transparent 62%),linear-gradient(160deg,#02050c,#05101f 54%,#02050c)}
#fx{position:absolute;inset:0;width:100%;height:100%;opacity:.42}
.floor{position:absolute;left:-20%;right:-20%;bottom:-44%;height:62%;transform:perspective(520px) rotateX(70deg);background-image:linear-gradient(rgba(84,178,255,.14) 1px,transparent 1px),linear-gradient(90deg,rgba(84,178,255,.14) 1px,transparent 1px);background-size:40px 40px;-webkit-mask-image:linear-gradient(to top,rgba(0,0,0,.9),transparent);mask-image:linear-gradient(to top,rgba(0,0,0,.9),transparent)}
.halo{position:absolute;left:50%;top:50%;width:min(82vh,560px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(96,190,255,.18),rgba(255,111,60,.08) 46%,transparent 70%);animation:breathe 7s ease-in-out infinite}
.grain{position:absolute;inset:-40%;z-index:12;pointer-events:none;opacity:.055;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");animation:grain .55s steps(3) infinite}
.vig{position:absolute;inset:0;z-index:11;pointer-events:none;background:radial-gradient(ellipse at 50% 48%,transparent 42%,rgba(0,0,0,.62) 100%)}
.bar{position:absolute;left:0;right:0;height:5.4%;background:#000;z-index:14;pointer-events:none}
.bar.top{top:0}.bar.bot{bottom:0}
.flash{position:absolute;inset:0;z-index:18;background:#fff;opacity:0;pointer-events:none;transition:opacity .18s ease}
.flash.on{opacity:.92;transition:none}
@keyframes grain{0%{transform:translate(0,0)}33%{transform:translate(-2.5%,2%)}66%{transform:translate(2%,-2.5%)}100%{transform:translate(0,0)}}
@keyframes breathe{50%{transform:translate(-50%,-50%) scale(1.07)}}
@keyframes blink{50%{opacity:.2}}
@keyframes float{50%{transform:translateY(-9px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes scan{0%{top:6%}50%{top:84%}100%{top:6%}}
@keyframes bar{to{width:100%}}
@keyframes namein{from{opacity:0;letter-spacing:.5em;filter:blur(7px)}to{opacity:1;filter:blur(0)}}
@keyframes risein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.panel{position:absolute;z-index:9;left:clamp(16px,3.8vw,62px);top:clamp(16px,5vh,52px);width:min(30%,372px)}
.act{display:inline-flex;align-items:center;gap:.55em;color:#7fb6e6;font-size:clamp(7.5px,.8vw,11px);font-weight:950;letter-spacing:.28em}
.act i{width:.5em;height:.5em;border-radius:50%;background:#5df2d6;box-shadow:0 0 10px #5df2d6;animation:blink 1.4s ease-in-out infinite}
.name{margin:clamp(6px,1.4vh,14px) 0 0;font-size:clamp(17px,min(3.1vw,4.3vh),40px);line-height:1.02;font-weight:950;letter-spacing:.1em;color:#fff;text-shadow:0 0 34px rgba(120,200,255,.42),0 8px 30px rgba(0,0,0,.7)}
.name.on{animation:namein .6s cubic-bezier(.2,.9,.2,1) both}
.ttl{margin:clamp(6px,1.3vh,13px) 0 0;color:#ffb08c;font-size:clamp(10px,min(1.25vw,1.8vh),17px);font-weight:900}
.sub{margin:clamp(5px,1vh,10px) 0 0;color:#93aec6;font-size:clamp(8.5px,min(.92vw,1.35vh),12.5px);line-height:1.6;max-width:330px}
.panel.on .ttl,.panel.on .sub{animation:risein .5s .12s ease both}
.stage{position:absolute;inset:0;z-index:4;overflow:hidden}
.shell{position:absolute;left:50%;top:50%;z-index:6;transform:translate(-50%,-50%);transition:transform 1.15s cubic-bezier(.22,.7,.2,1);will-change:transform}
.phone{position:relative;width:var(--pw,300px);height:var(--ph,640px);container-type:size;border-radius:44px;background:linear-gradient(150deg,#0c1a2c,#05080f);border:1px solid rgba(150,205,240,.24);box-shadow:0 40px 100px rgba(0,0,0,.74),0 0 70px rgba(52,140,255,.16);animation:float 6s ease-in-out infinite}
.phone.paused{animation-play-state:paused}
.phone::before{content:'';position:absolute;inset:5px;border-radius:39px;background:#0a0f16}
.phone::after{content:'';position:absolute;inset:0;border-radius:44px;pointer-events:none;background:linear-gradient(112deg,transparent 18%,rgba(255,255,255,.07) 42%,transparent 58%)}
.brandbar{position:absolute;top:9px;left:50%;transform:translateX(-50%);z-index:4;display:flex;align-items:center;gap:6px}
.island{width:clamp(44px,7.5cqw,58px);height:11px;border-radius:99px;background:#01030a}
.lens{width:5px;height:5px;border-radius:50%;background:#122;box-shadow:inset 0 0 2px #4af}
.screen{position:absolute;inset:5px;border-radius:39px;overflow:hidden;z-index:3;background:#fff7f0;color:#2b2620;font-size:4.3cqw;line-height:1.35}
.view{position:absolute;inset:0;display:flex;flex-direction:column;gap:.62em;padding:2.5em .85em .95em;opacity:0;transform:translateY(.9em);transition:opacity .32s ease,transform .32s ease}
.view.on{opacity:1;transform:none}
.sbar{display:flex;justify-content:space-between;align-items:center;color:#b6a496;font-size:.56em;font-weight:800}
.appbar{display:flex;justify-content:space-between;align-items:center;gap:.5em}
.appbar span{font-size:1.05em;font-weight:950}
.pill{padding:.34em .6em;border-radius:99px;background:#fff0e6;border:1px solid #ffd8c2;color:#e95422;font-size:.55em;font-weight:950;letter-spacing:.08em;white-space:nowrap}
.pill.warn{background:#ffe9e9;border-color:#ffc9c9;color:#d33a3a}
.pill.darkk{background:#10203a;border-color:#23456f;color:#7fd8ff}
.card{background:#fff;border:1px solid #f2e0d2;border-radius:.85em;padding:.7em .75em;box-shadow:0 .5em 1.2em rgba(150,110,80,.07)}
.card.dark{background:linear-gradient(150deg,#16202f,#0d1421);border-color:#22344c;color:#dbe9f7}
.card.dark .k{color:#7ea0c0}
.k{display:block;color:#b8a89a;font-size:.55em;font-weight:950;letter-spacing:.1em;text-transform:uppercase}
.v{font-size:.85em;font-weight:900;margin-top:.3em}
.row{display:flex;justify-content:space-between;align-items:center;gap:.5em;font-size:.68em;color:#5d5148}
.row+.row{margin-top:.4em}
.row b{font-weight:900;color:#2b2620}
.mini{height:.5em;border-radius:99px;background:#f0e3d8}
.mini.o{background:linear-gradient(90deg,#ffb08c,#ff6f3c)}
.mini.b{background:linear-gradient(90deg,#8fc9ff,#3f8bf5)}
.mini.g{background:linear-gradient(90deg,#9ae7c8,#2fc08c)}
.mini+.mini{margin-top:.42em}
.tags{display:flex;flex-wrap:wrap;gap:.35em;margin-top:.5em}
.tag{padding:.28em .55em;border-radius:99px;background:#fff0e6;color:#d9552a;font-size:.55em;font-weight:900}
.tag.b{background:#e9f2ff;color:#2f6fd0}
.tag.g{background:#e7f8f1;color:#22946b}
.btn{margin-top:auto;padding:.85em;border-radius:.85em;background:linear-gradient(135deg,#ff8a5c,#ff6f3c);color:#fff;text-align:center;font-size:.82em;font-weight:950;box-shadow:0 .7em 1.4em rgba(255,111,60,.32)}
.btn.dark{background:linear-gradient(135deg,#2a5cff,#4aa8ff);box-shadow:0 .7em 1.4em rgba(60,130,255,.3)}
.viewer{position:relative;flex:1;min-height:0;border-radius:1em;background:linear-gradient(150deg,#26303f,#171d29);overflow:hidden;border:1px solid #2b3648}
.corner{position:absolute;width:1.5em;height:1.5em;border:2px solid rgba(120,235,205,.85)}
.corner.tl{top:.7em;left:.7em;border-right:0;border-bottom:0;border-radius:.5em 0 0 0}
.corner.tr{top:.7em;right:.7em;border-left:0;border-bottom:0;border-radius:0 .5em 0 0}
.corner.bl{bottom:.7em;left:.7em;border-right:0;border-top:0;border-radius:0 0 0 .5em}
.corner.br{bottom:.7em;right:.7em;border-left:0;border-top:0;border-radius:0 0 .5em 0}
.hint{position:absolute;left:50%;bottom:16%;transform:translateX(-50%);color:#9fb6cb;font-size:.58em;font-weight:800;white-space:nowrap}
.shutter{position:absolute;left:50%;bottom:5%;transform:translateX(-50%);width:2.5em;height:2.5em;border-radius:50%;background:#fff;border:.25em solid rgba(255,255,255,.45);box-shadow:0 0 0 .18em rgba(255,111,60,.9)}
.camrow{display:flex;gap:.4em;justify-content:center}
.camtab{padding:.35em .8em;border-radius:99px;background:#fff;border:1px solid #f0ded1;color:#a1907f;font-size:.58em;font-weight:950;letter-spacing:.08em}
.camtab.on{background:#fff0e6;border-color:#ffd0b6;color:#e95422}
.thumb{position:relative;flex:1;min-height:0;border-radius:.9em;overflow:hidden;background:linear-gradient(150deg,#ffe2d0,#ffd0b8);border:1px solid #f6d6c2;display:grid;place-items:center}
.float{width:3.4em;height:3.4em;border-radius:.7em;background:linear-gradient(150deg,#fff,#ffe7db);box-shadow:0 1em 2em rgba(180,110,70,.22);display:grid;place-items:center;color:#e95422;font-size:.8em;font-weight:950}
.scanline{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#ff8a5c,#ffd9c6,transparent);box-shadow:0 0 14px rgba(255,111,60,.8);animation:scan 1.9s ease-in-out infinite}
.check{width:1.1em;height:1.1em;border-radius:50%;background:#e7f8f1;color:#22946b;display:grid;place-items:center;font-size:.62em;font-weight:950;flex:0 0 auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.45em}
.node{padding:.6em .3em;border-radius:.7em;background:#fff;border:1px solid #f2e0d2;text-align:center;font-size:.55em;font-weight:900;color:#6b5c50}
.node.on{background:#fff0e6;border-color:#ffc9ab;color:#e95422}
.stat{font-size:1.9em;font-weight:950;color:#e95422;line-height:1}
.bars{display:flex;align-items:flex-end;gap:.3em;height:2.6em;margin-top:.5em}
.bars i{flex:1;border-radius:.3em .3em 0 0;background:linear-gradient(180deg,#ffb08c,#ff8a5c)}
.steps{display:flex;gap:.35em}
.step{flex:1;padding:.55em .2em;border-radius:.65em;background:#fff;border:1px dashed #f0d9c8;text-align:center;font-size:.52em;font-weight:950;color:#b98a6c}
.cta{text-align:center;color:#e95422;font-size:.6em;font-weight:900}
.ring{width:2.4em;height:2.4em;border-radius:50%;border:.22em solid rgba(255,111,60,.18);border-top-color:#ff6f3c;animation:spin 1s linear infinite;margin:auto}

/* ===== blue tech theme - matches mwpinaistudio.com palette ===== */
.demo{background:radial-gradient(900px 520px at 14% -10%,rgba(64,150,255,.22),transparent 60%),radial-gradient(1000px 560px at 88% 3%,rgba(93,242,214,.13),transparent 62%),radial-gradient(760px 760px at 50% 122%,rgba(48,120,255,.18),transparent 62%),linear-gradient(160deg,#030710,#07111f 54%,#030710)}

.k{color:#7ba3c9}

.btn.dark{background:linear-gradient(135deg,#2a5cff,#4aa8ff);color:#eaf6ff}

.hint{color:#8fb6d8}

.camtab{background:rgba(255,255,255,.06);border-color:rgba(120,180,240,.25);color:#8fb0cf}
.camtab.on{background:rgba(40,120,190,.45);border-color:rgba(93,242,214,.6);color:#9ff5e2}

.focus{position:absolute;z-index:9;opacity:0;transform:scale(1.28);transition:opacity .18s ease,transform .34s cubic-bezier(.2,.9,.2,1)}
.focus.on{opacity:1;transform:none}
.focus i{position:absolute;width:15px;height:15px;border:2px solid #5df2d6;filter:drop-shadow(0 0 7px rgba(93,242,214,.85))}
.focus i:nth-child(1){top:-1px;left:-1px;border-right:0;border-bottom:0}
.focus i:nth-child(2){top:-1px;right:-1px;border-left:0;border-bottom:0}
.focus i:nth-child(3){bottom:-1px;left:-1px;border-right:0;border-top:0}
.focus i:nth-child(4){bottom:-1px;right:-1px;border-left:0;border-top:0}
.lead{position:absolute;inset:0;width:100%;height:100%;z-index:8;overflow:visible;pointer-events:none}
.lead path{fill:none;stroke:#5df2d6;stroke-width:1.4;stroke-linejoin:round;filter:drop-shadow(0 0 5px rgba(93,242,214,.6))}
.lead circle{fill:#5df2d6;filter:drop-shadow(0 0 6px #5df2d6)}
.label{position:absolute;z-index:10;left:50%;top:56%;transform:translateX(-50%);width:min(82%,820px);padding:clamp(14px,1.35vw,20px) clamp(18px,1.9vw,30px);border:1px solid rgba(93,242,214,.34);border-radius:16px;background:linear-gradient(140deg,rgba(5,18,32,.96),rgba(3,10,20,.95));box-shadow:0 26px 64px rgba(0,0,0,.6);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);opacity:0;filter:blur(6px);transition:opacity .34s ease,filter .34s ease}
.label.on{opacity:1;filter:blur(0)}
.lhead{display:flex;align-items:center;justify-content:center;gap:.55em;margin-bottom:.5em}
.ldot{width:6px;height:6px;border-radius:50%;background:#5df2d6;box-shadow:0 0 10px #5df2d6;animation:blink 1.4s infinite;flex:0 0 auto}
.lhead b{font-size:clamp(9px,min(1vw,1.5vh),13.5px);letter-spacing:.14em;color:#7dffe2;font-weight:950}
.label p{margin:0;color:#d7e6f3;text-align:center;font-size:clamp(13px,min(1.5vw,2.5vh),24px);line-height:1.55;min-height:1.55em;letter-spacing:.004em}
.caret{display:inline-block;width:.42em;height:1em;background:#5df2d6;vertical-align:-.14em;animation:blink .75s steps(1) infinite}

.hudtag.on{opacity:1}
.hudtag i{width:.5em;height:.5em;border-radius:50%;background:#ff5a3c;box-shadow:0 0 10px #ff5a3c;animation:blink 1.2s infinite}
.progress{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.07);overflow:hidden;z-index:16}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5df2d6,#7fb6ff,#ff9a6c)}

.snd.empty{animation:blink 1.6s ease-in-out infinite}
.snd .sp{color:#8fb0c7}
.snd .ver{color:#6f93b5;font-size:.85em;letter-spacing:.02em}

.panel{position:relative;left:auto;top:auto;width:100%;order:1;padding:16px 18px 0;display:flex;flex-direction:column;align-items:center;text-align:center}
.name{font-size:clamp(16px,5.2vw,28px);letter-spacing:.08em}
.ttl{font-size:clamp(10px,3vw,15px)}

}

</style>

<body>
<div class="demo" id="demo">
  <canvas id="fx"></canvas>
  <div class="floor"></div>
  <div class="halo"></div>

  <div class="stage" id="stage">
    <div class="shell" id="shell">
      <div class="phone" id="phone">
        <div class="brandbar"><div class="island"></div><div class="lens"></div></div>
        <div class="screen" id="screen"></div>
      </div>
    </div>
    <svg class="lead" id="leadsvg"><path id="lead" d=""></path><circle id="leadDot" r="3.4" cx="-20" cy="-20"></circle></svg>
    <div class="focus" id="focus"><i></i><i></i><i></i><i></i></div>
    <div class="label" id="label"><div class="lhead"><span class="ldot"></span><b id="lname"></b></div><p id="ltext"></p></div>
  </div>

  <div class="panel" id="panel">
    <div class="act"><i></i><span id="act">ACT 01 / 07</span></div>
    <h1 class="name" id="name">THE OLD WAY</h1>
    <div class="ttl" id="title"></div>
    <div class="sub" id="sub"></div>
  </div>

  <div class="hudtag" id="hudtag"><i></i><span id="hudtxt">STANDBY</span></div>
  <div class="snd empty" id="snd">TAP FOR SOUND</div>
  <div class="vig"></div>
  <div class="grain"></div>
  <div class="bar top"></div><div class="bar bot"></div>
  <div class="flash" id="flash"></div>
  <div class="progress"><i id="bar"></i></div>
</div>
<script>
(function(){
const demo=document.getElementById('demo'),stage=document.getElementById('stage'),shell=document.getElementById('shell'),phone=document.getElementById('phone'),screen=document.getElementById('screen'),
panel=document.getElementById('panel'),act=document.getElementById('act'),nameEl=document.getElementById('name'),titleEl=document.getElementById('title'),subEl=document.getElementById('sub'),
focus=document.getElementById('focus'),label=document.getElementById('label'),lname=document.getElementById('lname'),ltext=document.getElementById('ltext'),
lead=document.getElementById('lead'),leadDot=document.getElementById('leadDot'),flash=document.getElementById('flash'),
hudtag=document.getElementById('hudtag'),hudtxt=document.getElementById('hudtxt'),snd=document.getElementById('snd'),bar=document.getElementById('bar');

const cv=document.getElementById('fx'),cx=cv.getContext('2d');let W=0,H=0,pts=[];
function resize(){W=cv.width=Math.max(320,demo.clientWidth);H=cv.height=Math.max(240,demo.clientHeight);pts=[];
